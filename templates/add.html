{% extends "base.html" %}
{% block title %}Ajouter un restaurant{% endblock %}

{% block content %}
<div class="container" style="max-width: 680px;">

  <div style="margin-bottom: 1.5rem;">
    <a href="/restaurants" style="color: var(--muted); text-decoration:none; font-size:0.875rem;">← Retour à la liste</a>
  </div>

  <h1 class="page-title" style="margin-bottom:1.8rem;">Ajouter un restaurant</h1>

  <div class="card">
    <form method="post">

      <div class="form-group">
        <label>Nom du restaurant *</label>
        <input type="text" name="name" required placeholder="Ex : Le Petit Bistro">
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label>Borough *</label>
          <select name="borough" required>
            <option value="">Choisir...</option>
            {% for b in boroughs %}
              <option value="{{ b }}">{{ b }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Type de cuisine *</label>
          <select name="cuisine" required>
            <option value="">Choisir...</option>
            {% for c in cuisines %}
              <option value="{{ c }}">{{ c }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div style="font-size:0.75rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; margin: 1.5rem 0 1rem;">Adresse</div>

      <div class="form-grid">
        <div class="form-group">
          <label>Numéro de bâtiment</label>
          <input type="text" name="building" placeholder="Ex : 200">
        </div>
        <div class="form-group">
          <label>Code postal</label>
          <input type="text" name="zipcode" placeholder="Ex : 10001">
        </div>
      </div>

      <div class="form-group">
        <label>Rue</label>
        <input type="text" name="street" placeholder="Ex : 5th Avenue">
      </div>

      <div style="display:flex; gap:0.75rem; margin-top:1.5rem;">
        <button type="submit" class="btn btn-primary">Ajouter le restaurant</button>
        <a href="/restaurants" class="btn btn-secondary">Annuler</a>
      </div>

    </form>
  </div>

</div>
{% endblock %}
